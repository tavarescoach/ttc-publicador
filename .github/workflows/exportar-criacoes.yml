name: Exportar criações

# Traz do painel para o repositório as criações que esperam o Claude
# (criacoes/pendentes.json + materiais enviados). O Claude dispara antes de "rodar os pedidos".

on:
  workflow_dispatch: {}

concurrency:
  group: exportar-criacoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar pedidos no painel
        env:
          SUPABASE_URL: https://txiszakrpssubgvzpdcx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python exportar_criacoes.py
      - name: Salvar no repositório
        run: |
          git add criacoes
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "criações: pedidos exportados do painel"
            git pull --rebase
            git push
          fi
