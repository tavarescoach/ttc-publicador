name: Renderizar stories

# Transforma render/stories/<data>.json em telas 1080x1920 (identidade LT),
# grava em midia/<data>/ e sobe para o bucket "midia" do Supabase.

on:
  push:
    paths:
      - "render/stories/**"
      - "render/story.html"
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Caminho (ex.: render/stories/2026-10-26.json). Vazio = os alterados no último commit."
        required: false
        default: ""

concurrency:
  group: renderizar-stories
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renderizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador e fonte
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter || true
      - name: Renderizar e subir
        env:
          SUPABASE_URL: https://txiszakrpssubgvzpdcx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARQ: ${{ github.event.inputs.arquivo }}
        run: |
          set -e
          if [ -n "$ARQ" ]; then LISTA="$ARQ"
          else LISTA=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- render/stories | grep '\.json$' || true); fi
          if [ -z "$LISTA" ]; then echo "Nada para renderizar."; exit 0; fi
          for p in $LISTA; do python render/story.py "$p" --subir; done
      - name: Guardar as telas no repositório
        run: |
          git add midia || true
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "stories: telas renderizadas"
            git pull --rebase
            git push
          fi
