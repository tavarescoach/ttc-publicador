<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<!-- Arte de treino no estilo "pop-out" do story do Strava: foto ao fundo, palavra gigante e rota atrás,
     o Luan recortado na frente, números pequenos no alto. 1080x1920 (story) ou 1080x1350 (feed). Uso: render/treino.py -->
<style>
:root{--txt:#F8FAFC;--red:#C1121F;--red2:#E5383B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--h)}
body{font-family:"Inter Display","Inter",sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;background:#050A16;position:relative;overflow:hidden}
.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 30%)}
.veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,22,.55) 0%,rgba(5,10,22,.12) 30%,rgba(5,10,22,0) 55%,rgba(5,10,22,.35) 100%)}
.palavra{position:absolute;left:0;right:0;text-align:center;font-weight:900;line-height:.8;letter-spacing:-.02em;text-transform:uppercase;color:var(--txt);opacity:.94;white-space:nowrap}
.rota{position:absolute;inset:0;width:100%;height:100%}
.rota-img{position:absolute;transform:translate(-50%,-50%)}
.rota path{fill:none;stroke:var(--red2);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.dados{position:absolute;left:0;right:0;top:var(--d0);display:flex;flex-direction:column;align-items:center;gap:22px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.dados.esq{left:72px;right:auto;align-items:flex-start;gap:18px}
.dados.esq .m{text-align:left}
.dados.lado{flex-direction:row;justify-content:center;gap:64px}
.m{text-align:center}
.m .r{font-size:24px;font-weight:600;letter-spacing:.3px;opacity:.92}
.m .v{margin-top:2px;font-size:var(--v);font-weight:700;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}
.m .v small{font-size:.62em;font-weight:600;margin-left:6px}
.m.dest .v{color:var(--red2)}
.topo{position:absolute;left:72px;right:72px;top:var(--t0);display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.logo{height:46px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.data{font-size:24px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.rod{position:absolute;left:72px;right:72px;bottom:var(--b0);display:flex;justify-content:space-between;font-family:"Inter",sans-serif;font-size:24px;color:#E2E8F0;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style></head>
<body><div id="raiz"></div>
<script>
const S = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const feed = S.formato === "feed", H = feed ? 1350 : 1920, ms = S.metricas || [];
const r = document.documentElement.style;
r.setProperty("--h", H + "px");
r.setProperty("--t0", (feed ? 56 : 230) + "px"); r.setProperty("--b0", (feed ? 40 : 240) + "px");
r.setProperty("--d0", (S.dados_topo ?? (feed ? 150 : 340)) + "px"); r.setProperty("--v", (feed ? 46 : 52) + "px");
if (S.foco) r.setProperty("--pos", S.foco);
// camadas: foto > véu > palavra + rota > recorte (o Luan na frente) > números, logo, rodapé
let h = `<img class="cam" src="${S.foto}" alt=""><div class="veu"></div>`;
if (S.palavra !== "") h += `<div class="palavra"><span id="palavra">${S.palavra || "TTC"}</span></div>`;
if (S.rota && S.rota.length > 1) {
  const d = S.rota.map((p, i) => `${i ? "L" : "M"}${(p[0] * 1080).toFixed(1)} ${(p[1] * H).toFixed(1)}`).join(" ");
  h += `<svg class="rota" viewBox="0 0 1080 ${H}"><path d="${d}"/></svg>`;
}
if (S.rota_img) {
  const [cx, cy, w] = S.rota_caixa || [.5, .6, .85];
  h += `<img class="rota-img" src="${S.rota_img}" style="left:${cx * 1080}px;top:${cy * H}px;width:${w * 1080}px" alt="">`;
}
if (S.recorte) h += `<img class="cam" src="${S.recorte}" alt="">`;
h += `<div class="topo"><img class="logo" src="assets/logo-lt.png" alt=""><span class="data">${S.data||""}</span></div>`;
h += `<div class="dados${S.lado_a_lado ? " lado" : ""}${S.dados_lado === "esquerda" ? " esq" : ""}">` + ms.map(m => `<div class="m${m.destaque?" dest":""}"><div class="r">${m.rotulo}</div><div class="v">${m.valor}${m.unidade?`<small>${m.unidade}</small>`:""}</div></div>`).join("") + `</div>`;
h += `<div class="rod"><span>@tavarescoach</span><span>Corpo forte, evolução sem acaso.</span></div>`;
document.getElementById("raiz").innerHTML = h;
// palavra gigante: ocupa a largura (margem de 40px) e assenta em palavra_base (fração da altura: 0,85 no story, 0,93 no feed)
document.fonts.ready.then(() => {
  const p = document.getElementById("palavra");
  if (p) {
    const c = p.parentElement;
    c.style.fontSize = "100px";
    c.style.fontSize = Math.min(100 * 1000 / p.getBoundingClientRect().width, H * .3) + "px";
    c.style.top = (H * (S.palavra_base ?? (feed ? .93 : .85)) - c.offsetHeight) + "px";
  }
  document.body.dataset.pronto = "1";
});
</script></body></html>
