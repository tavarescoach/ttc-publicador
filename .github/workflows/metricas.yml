name: Métricas do Instagram

# Por enquanto: só testa o que o token consegue ler (metricas/permissoes.json).
# O coletor de métricas entra aqui depois.

on:
  workflow_dispatch: {}

concurrency:
  group: metricas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar permissões do token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python metricas/checar_permissoes.py
      - name: Salvar no repositório
        if: always()
        run: |
          git add metricas
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "métricas: teste de permissões"
            git pull --rebase
            git push
          fi
