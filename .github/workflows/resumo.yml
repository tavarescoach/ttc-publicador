name: Resumo da véspera

# Monta resumo/amanha.md (o que sai amanhã, o que espera o Luan, o que ele faz).
# Disparado pela tarefa agendada das 21h, que envia o texto para o celular.

on:
  workflow_dispatch: {}

concurrency:
  group: resumo-vespera
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar o resumo
        env:
          SUPABASE_URL: https://txiszakrpssubgvzpdcx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python resumo.py
      - name: Salvar no repositório
        run: |
          git add resumo
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "resumo: véspera"
            git pull --rebase
            git push
          fi
