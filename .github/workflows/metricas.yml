name: Métricas do Instagram

# Coleta seguidores, alcance, desempenho dos posts e MÉTODO no direct.
# Grava metricas/painel.json e metricas/historico.json e envia o resumo ao painel.
# Roda às 7h17 e 19h17 (Brasília) e quando disparado.

on:
  schedule:
    - cron: "17 10,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: metricas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar métricas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SUPABASE_URL: https://txiszakrpssubgvzpdcx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python metricas/coletar.py
      - name: Salvar no repositório
        if: always()
        run: |
          git add metricas
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "métricas: coleta"
            git pull --rebase
            git push
          fi
