<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Estático v2 (diretrizes/estatico.md, aprovado em 26/11/2026: padrão do post "ERRO").
   Foto de fundo inteira, logo LT no alto, bloco no terço inferior: traço vermelho, etiqueta da função,
   linhas brancas em fonte condensada e a última linha (o desfecho) em vermelho. Sem CTA na arte. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#05080F}
body{font-family:"Roboto Condensed","Liberation Sans Narrow","Arial Narrow",sans-serif;-webkit-font-smoothing:antialiased}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0E1626 center/cover no-repeat}
.s::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(5,8,15,.55) 0%,rgba(5,8,15,0) 18%,rgba(5,8,15,0) 42%,rgba(5,8,15,.78) 68%,rgba(5,8,15,.94) 100%)}
.logo{position:absolute;z-index:2;left:56px;top:50px;height:70px}
.corpo{position:absolute;z-index:2;left:64px;right:56px;bottom:112px;top:520px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.traco{width:72px;height:8px;background:#C1121F;margin-bottom:16px}
.etq{font-size:36px;font-weight:700;color:#F8FAFC;letter-spacing:.01em;text-transform:uppercase;margin-bottom:18px}
h1{font-weight:700;color:#FFFFFF;letter-spacing:-.025em;line-height:.9;white-space:pre-line}
h1 .v{color:#C1121F;display:block}
.rod{position:absolute;z-index:2;left:66px;bottom:52px;font-size:27px;font-weight:700;color:#F8FAFC;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
</style></head>
<body><div id="raiz"></div>
<script>
const S = window.SLIDE;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg = S.foto ? `background-image:url('${S.foto}');background-position:${esc(S.foco || "center 30%")}` : "";
document.getElementById("raiz").innerHTML = `<section class="s" style="${bg}">
  <img class="logo" src="assets/logo-lt.png" alt="">
  <div class="corpo">
    <div class="traco"></div>
    <div class="etq">${esc(S.etiqueta)}</div>
    <h1><span class="b">${esc(S.linhas_brancas)}</span><span class="v">${esc(S.linha_vermelha)}</span></h1>
  </div>
  <div class="rod">@tavarescoach</div>
</section>`;
// Ajuste automático: começa em 120px e reduz até caber na largura e na altura do bloco (mínimo 84px).
const h1 = document.querySelector("h1"), corpo = document.querySelector(".corpo");
let tam = 120;
const cabe = () => h1.scrollWidth <= corpo.clientWidth + 2 && corpo.scrollHeight <= corpo.clientHeight + 2
  && [...h1.querySelectorAll("span")].every(e => e.scrollWidth <= corpo.clientWidth + 2);
h1.style.fontSize = tam + "px";
while (!cabe() && tam > 84) { tam -= 4; h1.style.fontSize = tam + "px"; }
</script></body></html>
