<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<!-- Arte de treino: foto do Luan + números do report. 1080x1920 (story) ou 1080x1350 (feed). Uso: render/treino.py -->
<style>
:root{--txt:#F8FAFC;--mut:#CBD5E1;--red:#C1121F;--red2:#E5383B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--h)}
body{font-family:"Inter Display","Inter",sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;background:#050A16;position:relative;overflow:hidden}
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 30%)}
.sombra{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,22,.70) 0%,rgba(5,10,22,.10) 18%,rgba(5,10,22,0) 38%,rgba(5,10,22,.55) 58%,rgba(5,10,22,.94) 78%,#050A16 100%)}
.topo{position:absolute;left:72px;right:72px;top:var(--t0);display:flex;justify-content:space-between;align-items:center}
.logo{height:50px}
.data{font-size:26px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);text-shadow:0 2px 8px rgba(0,0,0,.7)}
.bloco{position:absolute;left:72px;right:72px;bottom:var(--b0)}
.barra{width:94px;height:7px;background:var(--red);margin-bottom:24px}
.rot{font-size:26px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
h1{font-size:var(--h1);line-height:1.02;font-weight:700;letter-spacing:-2px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h1 b{color:var(--red2)}
.grade{margin-top:44px;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:34px 28px;border-top:2px solid rgba(248,250,252,.16);padding-top:38px}
.m .v{font-size:var(--v);font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.m .v small{font-size:.42em;font-weight:600;letter-spacing:0;margin-left:6px;color:var(--mut)}
.m .r{margin-top:10px;font-size:23px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.m.dest .v{color:var(--red2)}
.frase{margin-top:38px;font-size:36px;line-height:1.3;font-weight:500;color:var(--txt)}
.rod{margin-top:40px;display:flex;justify-content:space-between;font-family:"Inter",sans-serif;font-size:25px;color:#94A3B8}
</style></head>
<body><div id="raiz"></div>
<script>
const S = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const md = t => (t||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const feed = S.formato === "feed", H = feed ? 1350 : 1920, ms = S.metricas || [];
const cols = S.colunas || (ms.length === 4 ? 2 : Math.min(3, ms.length || 1));
const r = document.documentElement.style;
r.setProperty("--h", H + "px"); r.setProperty("--cols", cols);
r.setProperty("--t0", (feed ? 64 : 250) + "px"); r.setProperty("--b0", (feed ? 56 : 250) + "px");
r.setProperty("--h1", (feed ? 72 : 84) + "px"); r.setProperty("--v", (cols >= 3 ? 74 : 92) * (feed ? .9 : 1) + "px");
if (S.foco) r.setProperty("--pos", S.foco);
let h = `<img class="foto" src="${S.foto}" alt=""><div class="sombra"></div>`;
h += `<div class="topo"><img class="logo" src="assets/logo-lt.png" alt=""><span class="data">${S.data||""}</span></div>`;
h += `<div class="bloco"><div class="barra"></div>${S.rotulo?`<div class="rot">${S.rotulo}</div>`:""}<h1>${md(S.titulo)}</h1>`;
h += `<div class="grade">` + ms.map(m => `<div class="m${m.destaque?" dest":""}"><div class="v">${m.valor}${m.unidade?`<small>${m.unidade}</small>`:""}</div><div class="r">${m.rotulo}</div></div>`).join("") + `</div>`;
if (S.frase) h += `<div class="frase">${md(S.frase)}</div>`;
h += `<div class="rod"><span>@tavarescoach</span><span>Corpo forte, evolução sem acaso.</span></div></div>`;
document.getElementById("raiz").innerHTML = h;
</script></body></html>
