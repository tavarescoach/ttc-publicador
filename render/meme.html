<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Meme · identidade LT (diretrizes/conteudo.md, seção 5): tarja branca com a frase, foto do Luan, rodapé LT. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#050505}
body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.s{position:relative;width:1080px;height:1350px;display:flex;flex-direction:column;overflow:hidden}
.corpo{background:#FFFFFF;color:#0B0B0B;padding:56px 96px 52px;flex:0 0 auto;max-height:420px;overflow:hidden}
.corpo p{font-size:62px;line-height:1.14;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.corpo p.m{font-size:54px}
.foto{flex:1;background:#1a1a1a center/cover no-repeat}
.rod{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:space-between;align-items:center;
  padding:22px 96px 8px}
.s::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(5,5,5,0) 0%,rgba(5,5,5,.8) 100%);z-index:1}
.rod{z-index:2}
.rod img{height:40px}
.rod span{font-size:26px;color:#F8FAFC;font-weight:500;letter-spacing:.5px}
</style></head>
<body><div id="raiz"></div>
<script>
const S = window.SLIDE;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const frase = S.frase || S.titulo || "";
const cls = frase.length > 48 ? "m" : "";
document.getElementById("raiz").innerHTML = `<section class="s">
  <div class="corpo"><p class="${cls}">${esc(frase)}</p></div>
  <div class="foto" style="${S.foto ? `background-image:url('${S.foto}');background-position:${esc(S.foco || "center 30%")}` : ""}"></div>
  <div class="rod"><img src="assets/logo-lt.png" alt=""><span>@tavarescoach</span></div>
</section>`;
</script></body></html>
