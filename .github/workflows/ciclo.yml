name: Ciclo temático

# Escolhe o tema do próximo ciclo de 3 dias (ciclo/escolher.py, conta fixa, sem IA) e prepara as fotos pessoais.
# Roda todo dia às 14h50 (Brasília), depois da curadoria das 14h17; só cria ciclo na véspera.
# Com "ativo": false em ciclo/config.json, só simula (ciclos/simulacao.json).

on:
  schedule:
    - cron: "50 17 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (true/false)"
        required: false
        default: "true"

concurrency:
  group: ciclo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  escolher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Atualizar o índice do acervo
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: python acervo/listar.py
      - name: Escolher o tema
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          SUPABASE_URL: https://txiszakrpssubgvzpdcx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SIMULAR: ${{ github.event.inputs.simular }}
        run: |
          EXTRA=""
          if [ "$SIMULAR" = "true" ]; then EXTRA="--simular"; fi
          python ciclo/escolher.py $EXTRA
      - name: Salvar no repositório
        if: always()
        run: |
          git add acervo/indice.json ciclos || true
          if ! git diff --cached --quiet; then
            git config user.name "ttc-publicador"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "ciclo: escolha do tema"
            git pull --rebase
            git push
          fi
