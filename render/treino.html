<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
<!-- Arte de treino no estilo "pop-out" do story do Strava, na identidade LT. 1080x1920 (story) ou 1080x1350 (feed).
     Camadas: fundo (foto desfocada e escurecida, ou a foto nítida) > palavra gigante > rota > cartão de música
     > o Luan recortado > contorno da palavra > números, logo e @. Uso: render/treino.py -->
<style>
:root{--txt:#F8FAFC;--mut:#CBD5E1;--red:#C1121F;--red2:#E5383B;--navy:#0B1222}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--h)}
body{font-family:"Inter Display","Inter",sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;background:var(--navy);position:relative;overflow:hidden}
.abs{position:absolute}
.cheia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 30%)}
.desfoque{position:absolute;inset:-80px;width:calc(100% + 160px);height:calc(100% + 160px);object-fit:cover;filter:blur(30px) saturate(.95) brightness(.82)}
.tinta{position:absolute;inset:0;background:
  radial-gradient(1000px 820px at 55% 45%,rgba(30,58,110,.10) 0%,rgba(11,18,34,.38) 62%,rgba(5,10,22,.78) 100%),
  linear-gradient(180deg,rgba(5,10,22,.62) 0%,rgba(11,18,34,.18) 32%,rgba(11,18,34,.12) 60%,rgba(5,10,22,.5) 100%)}
.chao{position:absolute;left:0;right:0;bottom:0;height:var(--chao);background:linear-gradient(180deg,rgba(5,10,22,0) 0%,rgba(5,10,22,.55) 45%,rgba(5,10,22,.92) 100%)}
.veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,22,.55) 0%,rgba(5,10,22,.08) 26%,rgba(5,10,22,0) 60%,rgba(5,10,22,.45) 100%)}
.palavra{position:absolute;left:0;right:0;text-align:center;font-weight:900;line-height:.78;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
.palavra.cheio{color:var(--txt)}
.palavra.linha{color:transparent;-webkit-text-stroke:3px rgba(248,250,252,.85);filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.rota{position:absolute;inset:0;width:100%;height:100%}
.rota path{fill:none;stroke:var(--red2);stroke-width:var(--traco,14px);stroke-linecap:round;stroke-linejoin:round}
.rota-img{position:absolute;transform:translate(-50%,-50%)}
.pessoa{position:absolute;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
.topo{position:absolute;left:72px;right:72px;top:var(--t0);display:flex;justify-content:space-between;align-items:center}
.logo{height:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.data{font-size:24px;font-weight:600;letter-spacing:.5px;color:#E2E8F0;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.dados{position:absolute;left:60px;right:60px;top:var(--d0);display:flex;justify-content:center;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.dados .m{flex:0 1 auto;padding:0 38px;text-align:center}
.dados .m+.m{border-left:2px solid rgba(248,250,252,.22)}
.dados.coluna{flex-direction:column;align-items:center;gap:20px}
.dados.coluna .m+.m{border-left:0}
.m .r{font-size:22px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--mut)}
.m .v{margin-top:6px;font-size:var(--v);font-weight:700;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .v small{font-size:.5em;font-weight:600;letter-spacing:0;margin-left:5px;color:var(--mut)}
.m.dest .v{color:var(--red2)}
.musica{position:absolute;left:50%;transform:translateX(-50%);width:var(--mw);padding:30px 34px 28px;border-radius:40px;
 background:rgba(30,41,59,.42);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
 border:1.5px solid rgba(248,250,252,.14);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mu-l{display:flex;align-items:center;gap:26px}
.capa{width:112px;height:112px;border-radius:18px;flex:none;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.capa.lt{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C1121F 0%,#5B0A12 55%,#0B1222 100%)}
.capa.lt svg{width:50px;height:50px;fill:#F8FAFC}
.mu-t{flex:1;min-width:0}
.mu-t b{display:block;font-size:35px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-t span{display:block;margin-top:4px;font-size:29px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ondas{display:flex;gap:5px;align-items:flex-end;height:34px;opacity:.7}
.ondas i{width:5px;border-radius:3px;background:var(--txt)}
.barra{margin-top:26px;display:flex;align-items:center;gap:18px;font-size:21px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.trilho{flex:1;height:9px;border-radius:5px;background:rgba(248,250,252,.22);overflow:hidden}
.trilho i{display:block;height:100%;background:rgba(248,250,252,.9);border-radius:5px}
.ctrl{margin-top:20px;display:flex;justify-content:center;align-items:center;gap:76px}
.ctrl svg{fill:var(--txt)}
</style></head>
<body><div id="raiz"></div>
<script>
const S = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const feed = S.formato === "feed", H = feed ? 1350 : 1920, ms = S.metricas || [];
const nitida = S.fundo === "foto";
const r = document.documentElement.style;
r.setProperty("--h", H + "px");
r.setProperty("--t0", (feed ? 56 : 232) + "px"); r.setProperty("--b0", (feed ? 44 : 236) + "px");
r.setProperty("--d0", (S.dados_topo ?? (feed ? 140 : 330)) + "px"); r.setProperty("--v", (S.tamanho_numeros ?? (feed ? 54 : 60)) + "px");
r.setProperty("--chao", (feed ? 300 : 520) + "px");
r.setProperty("--mw", ((S.musica && S.musica.largura) || .8) * 1080 + "px");
if (S.foco) r.setProperty("--pos", S.foco);

// pessoa: no fundo desfocado, o recorte é posto inteiro, ancorado na base, com a largura pedida
const P = Object.assign({largura: 1, x: .5, base: feed ? 1.3 : 1.08}, S.pessoa || {});
const pessoa = () => nitida ? `<img class="cheia" src="${S.recorte}" alt="">`
  : `<img class="pessoa" id="pessoa" src="${S.recorte}" style="width:${P.largura * 1080}px;left:${P.x * 1080}px;bottom:${(1 - P.base) * H}px;transform:translateX(-50%)" alt="">`;
const palavra = cls => `<div class="palavra ${cls}"><span>${S.palavra}</span></div>`;
const temPalavra = S.palavra !== "" && S.palavra != null;

let h = nitida ? `<img class="cheia" src="${S.foto}" alt=""><div class="veu"></div>`
  : `<img class="desfoque" src="${S.foto}" alt=""><div class="tinta"></div>`;
if (temPalavra) h += palavra("cheio");
if (S.rota && S.rota.length > 1) {
  const d = S.rota.map((p, i) => `${i ? "L" : "M"}${(p[0] * 1080).toFixed(1)} ${(p[1] * H).toFixed(1)}`).join(" ");
  h += `<svg class="rota" viewBox="0 0 1080 ${H}"><path d="${d}"/></svg>`;
}
if (S.rota_img) {
  const [cx, cy, w] = S.rota_caixa || [.5, .55, .95];
  h += `<img class="rota-img" src="${S.rota_img}" style="left:${cx * 1080}px;top:${cy * H}px;width:${w * 1080}px" alt="">`;
}
if (S.musica) {
  const M = S.musica, pr = M.progresso ?? .62;
  const capa = M.capa ? `<img class="capa" src="${M.capa}" alt="">` : `<div class="capa lt"><svg viewBox="0 0 24 24"><path d="M9 17.5V5.2l11-2.2v12.3a3 3 0 1 1-2-2.83V6.4l-7 1.4v9.7a3 3 0 1 1-2-2.83z"/></svg></div>`;
  const ondas = [14, 26, 20, 32, 18, 24].map(a => `<i style="height:${a}px"></i>`).join("");
  h += `<div class="musica" style="top:${M.topo ?? (feed ? 250 : 470)}px">
    <div class="mu-l">${capa}<div class="mu-t"><b>${M.titulo}</b><span>${M.artista || ""}</span></div><div class="ondas">${ondas}</div></div>
    <div class="barra"><span>${M.tempo || "2:42"}</span><div class="trilho"><i style="width:${pr * 100}%"></i></div><span>${M.resta || "-1:37"}</span></div>
    ${M.controles === false ? "" : `<div class="ctrl">
      <svg width="58" height="36" viewBox="0 0 58 36"><path d="M28 0v36L0 18zM58 0v36L30 18z"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44"><rect width="11" height="44" rx="2"/><rect x="23" width="11" height="44" rx="2"/></svg>
      <svg width="58" height="36" viewBox="0 0 58 36"><path d="M0 0v36l28-18zM30 0v36l28-18z"/></svg>
    </div>`}</div>`;
}
if (S.recorte) h += pessoa();
h += `<div class="chao"></div>`;
if (temPalavra && S.contorno !== false && !nitida) h += palavra("linha");
h += `<div class="topo"><img class="logo" src="assets/logo-lt.png" alt=""><span class="data">${S.data ? S.data + " · " : ""}@tavarescoach</span></div>`;
if (ms.length) h += `<div class="dados${S.dados_coluna ? " coluna" : ""}">` + ms.map(m => `<div class="m${m.destaque ? " dest" : ""}"><div class="r">${m.rotulo}</div><div class="v">${m.valor}${m.unidade ? `<small>${m.unidade}</small>` : ""}</div></div>`).join("") + `</div>`;
document.getElementById("raiz").innerHTML = h;

// palavra gigante: ocupa a largura (margem de 40px) e assenta em palavra_base (fração da altura)
document.fonts.ready.then(async () => {
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(ok => { i.onload = i.onerror = ok; })));
  const base = S.palavra_base ?? (feed ? .965 : .9);
  document.querySelectorAll(".palavra").forEach(c => {
    const s = c.firstElementChild;
    c.style.fontSize = "100px";
    c.style.fontSize = Math.min(100 * 1000 / s.getBoundingClientRect().width, H * .3) + "px";
    c.style.top = (H * base - c.offsetHeight) + "px";
  });
  document.body.dataset.pronto = "1";
});
</script></body></html>
