<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Capa de reels 1080x1920 · identidade LT.
   Área segura do grid do perfil (3:4): faixa central de 1080x1440 (y 240 a 1680). Tudo importante fica nela. */
:root{--txt:#F8FAFC;--red:#C1121F;--mut:#CBD5E1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050505}
body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--txt)}
.bg{position:absolute;inset:0;background:#0F172A center/cover no-repeat;filter:grayscale(.2) contrast(1.08) brightness(.82)}
.ve{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,20,.55) 0%,rgba(5,8,20,0) 22%,rgba(5,8,20,0) 42%,rgba(5,8,20,.85) 66%,rgba(5,8,20,.97) 100%)}
.logo{position:absolute;left:90px;top:290px;height:50px}
.bloco{position:absolute;left:90px;right:90px;bottom:350px;display:flex;flex-direction:column;gap:26px}
.rot{font-size:28px;letter-spacing:5px;text-transform:uppercase;color:var(--red);font-weight:700}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:-.005em;font-size:132px;text-wrap:balance}
h1.m{font-size:112px} h1.p{font-size:96px}
h1 b{color:var(--red);font-weight:inherit}
p{font-size:38px;line-height:1.3;color:var(--mut);font-weight:500;max-width:860px}
.arroba{position:absolute;left:90px;bottom:282px;font-size:28px;color:var(--mut);letter-spacing:1px}
</style></head>
<body>
<div class="bg" id="bg"></div><div class="ve"></div>
<img class="logo" src="assets/logo-lt.png" alt="">
<div class="bloco" id="bloco"></div>
<div class="arroba">@tavarescoach</div>
<script>
const S = window.SLIDE;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const n = (S.titulo || "").replace(/\*\*/g, "").length;
if (S.foto) document.getElementById("bg").style.backgroundImage = `url('${S.foto}')`;
document.getElementById("bloco").innerHTML =
  (S.rotulo ? `<div class="rot">${fmt(S.rotulo)}</div>` : "") +
  `<h1 class="${n > 48 ? "p" : n > 30 ? "m" : ""}">${fmt(S.titulo)}</h1>` +
  (S.subtitulo ? `<p>${fmt(S.subtitulo)}</p>` : "");
</script></body></html>
