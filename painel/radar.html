<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Radar de Pautas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0F172A;--bg2:#050505;--card:#162036;--card2:#1C2842;--line:#26324D;--txt:#F8FAFC;--mut:#94A3B8;--suave:#CBD5E1;--red:#C1121F;--ok:#22C55E;--amar:#F59E0B}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1560px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo b{font-style:italic;font-weight:800;font-size:20px;letter-spacing:-1px}
.logo i{width:2px;height:26px;background:var(--txt)}
.logo span{display:flex;flex-direction:column;line-height:1.05}
.logo strong{font-size:13px;letter-spacing:.5px}
.logo small{font-size:8.5px;letter-spacing:3.2px;color:var(--mut)}
.top h1{font-size:15px;font-weight:600;color:var(--suave)}
.top .sp{flex:1}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--card)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.wrap{max-width:1560px;margin:0 auto;padding:18px 16px 48px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}

/* calendário */
.cal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.cdia{flex:0 0 260px;background:linear-gradient(135deg,rgba(193,18,31,.18),rgba(22,32,54,1) 60%);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.cdia small{font-size:10.5px;letter-spacing:1.3px;color:#FCA5A5;font-weight:700;text-transform:uppercase}
.cdia b{display:block;margin:4px 0;font-size:14px}
.cdia span{font-size:12px;color:var(--suave);line-height:1.4;display:block}

/* barra */
.barra{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:16px}
.abas{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
.abas button{padding:7px 14px;border-radius:7px;font-size:13px;color:var(--mut);font-weight:600}
.abas button.on{background:var(--card2);color:var(--txt)}
.fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fg>span{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin-right:2px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.chip:hover{color:var(--txt)}
.chip.on{border-color:var(--red);color:#fff;background:rgba(193,18,31,.12)}

/* cards de notícia */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.nt{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.nt.desc{opacity:.5}
.th{position:relative;aspect-ratio:16/9;background:var(--bg2) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:12px}
.th .nota{position:absolute;top:10px;right:10px;font-weight:800;font-size:15px;padding:5px 9px;border-radius:8px;background:rgba(5,5,5,.85);font-variant-numeric:tabular-nums}
.th .canal{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;letter-spacing:.6px;padding:4px 8px;border-radius:5px;background:rgba(5,5,5,.85)}
.th .alta{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:5px;background:var(--red);color:#fff}
.nt .cp{padding:14px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.nt h3{font-size:15px;line-height:1.35;text-wrap:balance}
.nt h3 a{text-decoration:none}.nt h3 a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--mut)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:4px;background:var(--card2);color:var(--txt);text-transform:uppercase}
.motivo{font-size:12.5px;color:var(--suave);line-height:1.45}
.pitch{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:7px;font-size:12.5px;line-height:1.45}
.pitch dt{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.pitch dd{margin:0;color:#E2E8F0}
.pitch .gancho{font-size:14px;font-weight:700;color:#fff;border-left:3px solid var(--red);padding-left:9px}
.acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.mini{font-size:12px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);text-decoration:none;white-space:nowrap}
.mini:hover{background:var(--card2)}
.mini.go{border-color:var(--red)}
.mini.on{background:rgba(34,197,94,.12);border-color:#1f5134;color:#86EFAC}
.vazio{color:var(--mut);padding:30px;border:1px dashed var(--line);border-radius:10px;text-align:center;line-height:1.6}

/* por canal */
.canais{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.cn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.cn-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cn-h .ini{width:36px;height:36px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:13px}
.cn-h b{flex:1;font-size:14.5px}
.cn-h small{color:var(--mut);font-size:12px}
.li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li .tm{width:84px;flex-shrink:0;aspect-ratio:4/3;border-radius:6px;background:var(--bg2) center/cover no-repeat}
.li .tx{flex:1;min-width:0}
.li b{font-size:13px;line-height:1.35;display:block}
.li em{font-style:normal;font-size:12px;color:var(--suave);display:block;margin-top:3px}
.li .nb{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.mais{font-size:12px;color:var(--mut);padding:8px 0 0}

/* modal detalhe */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:20}
.fundo .nt{max-width:560px;width:100%;max-height:92vh;overflow:auto}
.centro{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--suave);line-height:1.7}
@media (max-width:820px){.logo span,.logo i{display:none}.grade,.canais{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top">
  <a class="logo" href="./"><b>LT</b><i></i><span><strong>LUAN TAVARES</strong><small>TREINADOR</small></span></a>
  <div><h1>Radar de pautas</h1><div class="sub" id="atual"></div></div>
  <div class="sp"></div>
  <a class="btn" href="./">← Painel</a>
  <a class="btn red" href="https://claude.ai/artifact/4qy326S1jHcMxz8Ycw4QbH" target="_blank" rel="noopener" style="color:#fff">Estúdio ↗</a>
</div></header>

<div class="wrap" id="app">
  <div class="centro" id="aviso">Carregando o radar...</div>
</div>
<div class="fundo hide" id="modal"></div>

<script>
const SUPABASE_URL = "https://txiszakrpssubgvzpdcx.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7gid6IZXgAiM0rbFRu52Q_MSnY2mYY";
const ESTUDIO = "https://claude.ai/artifact/4qy326S1jHcMxz8Ycw4QbH";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let itens = [];
let ui = {vista:"melhores", tema:"todos", publico:"todos", frescor:72, status:"novos", alta:false};
try { ui = {...ui, ...JSON.parse(localStorage.getItem("ltRadar") || "{}")}; } catch(_){}
const salvarUi = () => { try { localStorage.setItem("ltRadar", JSON.stringify(ui)); } catch(_){} };

const TEMAS = [["todos","Todos"],["saude","Saúde"],["ciencia","Ciência"],["tecnologia","Tecnologia"],["esporte","Esporte"],["comportamento","Comportamento"],["cultura","Cultura"],["negocio","Negócio"]];
const PUBS = [["todos","Todos"],["executivo","Executivo 30–45"],["mulher","Mulher 30–50"]];
const FRESC = [[24,"24 h"],[72,"3 dias"],[168,"7 dias"]];
const STATUS = [["novos","Novos"],["salvo","Salvos"],["virou_pauta","Viraram pauta"],["descartado","Descartados"]];

function corNota(n){ return n == null ? "var(--mut)" : n >= 75 ? "#86EFAC" : n >= 50 ? "#FCD34D" : "var(--mut)"; }
function ha(iso){
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 0) { const d = Math.ceil(-m/1440); return d <= 1 ? "amanhã" : `em ${d} dias`; }
  return m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m/60)} h` : `há ${Math.round(m/1440)} d`;
}
function iniciais(c){ return c.replace(/[^A-Za-zÀ-ú ]/g,"").split(" ").filter(Boolean).slice(0,2).map(p => p[0]).join("").toUpperCase(); }

function passa(i){
  if (i.calendario) return false;
  if (ui.status === "novos" ? !["novo", null, undefined].includes(i.status) : i.status !== ui.status) return false;
  if (ui.tema !== "todos" && i.tema !== ui.tema) return false;
  if (ui.publico !== "todos" && !(i.publico || "").includes(ui.publico === "executivo" ? "executivo" : "mulher") && i.publico !== "ambos") return false;
  if (ui.alta && !i.em_alta) return false;
  if (i.publicado_em && Date.now() - new Date(i.publicado_em) > ui.frescor * 3600e3) return false;
  return true;
}

function cardNoticia(i, grande){
  const p = i.pitch || null;
  return `<article class="nt ${i.status === "descartado" ? "desc" : ""}">
    <div class="th" ${i.imagem ? `style="background-image:url('${esc(i.imagem)}')"` : ""}>${i.imagem ? "" : esc(i.canal)}
      ${i.em_alta ? `<span class="alta">EM ALTA</span>` : ""}
      <span class="nota" style="color:${corNota(i.nota)}">${i.nota == null ? "—" : i.nota}</span>
      <span class="canal">${esc(i.canal)}</span></div>
    <div class="cp">
      <h3>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.titulo)}</a>` : esc(i.titulo)}</h3>
      <div class="meta">${i.tema ? `<span class="tag">${esc(i.tema)}</span>` : ""}${i.publico ? `<span class="tag">${esc(i.publico)}</span>` : ""}<span>${esc(ha(i.publicado_em))}</span></div>
      ${i.motivo ? `<div class="motivo">${esc(i.motivo)}</div>` : (i.curado ? "" : `<div class="motivo">Aguardando a curadoria do Claude (6h17 e 14h17).</div>`)}
      ${p ? `<dl class="pitch">
        <div><dt>Gancho</dt><dd class="gancho">${esc(p.gancho)}</dd></div>
        <div><dt>Ângulo</dt><dd>${esc(p.angulo)}</dd></div>
        <div><dt>Formato</dt><dd>${esc(p.formato)}</dd></div>
        <div><dt>Ponte para a venda</dt><dd>${esc(p.ponte)}</dd></div></dl>` : ""}
      <div class="acoes">
        <a class="mini go" href="${ESTUDIO}#radar-${esc(i.id)}" target="_blank" rel="noopener" data-pauta="${esc(i.id)}">Criar a partir desta ↗</a>
        <button class="mini ${i.status === "salvo" ? "on" : ""}" data-st="${esc(i.id)}" data-v="${i.status === "salvo" ? "novo" : "salvo"}">${i.status === "salvo" ? "Salvo ✓" : "Salvar"}</button>
        <button class="mini" data-st="${esc(i.id)}" data-v="${i.status === "descartado" ? "novo" : "descartado"}">${i.status === "descartado" ? "Restaurar" : "Descartar"}</button>
        ${i.link ? `<a class="mini" href="${esc(i.link)}" target="_blank" rel="noopener">Ler matéria ↗</a>` : ""}
      </div>
    </div></article>`;
}

function chips(nome, lista){ return lista.map(([k,t]) => `<button class="chip ${String(ui[nome]) === String(k) ? "on" : ""}" data-f="${nome}" data-v="${k}">${t}</button>`).join(""); }

function render(){
  const cal = itens.filter(i => i.calendario).sort((a,b) => (a.publicado_em||"").localeCompare(b.publicado_em||""));
  const lista = itens.filter(passa).sort((a,b) => (b.nota ?? -1) - (a.nota ?? -1) || (b.publicado_em||"").localeCompare(a.publicado_em||""));
  const ult = itens.reduce((m,i) => i.coletado_em > m ? i.coletado_em : m, "");
  $("atual").textContent = ult ? `Atualizado ${ha(ult)} · ${itens.filter(i => !i.calendario).length} notícias de ${new Set(itens.filter(i=>!i.calendario).map(i => i.canal)).size} canais` : "";

  let corpo = "";
  if (ui.vista === "melhores"){
    corpo = lista.length ? `<div class="grade">${lista.slice(0, 60).map(i => cardNoticia(i)).join("")}</div>`
      : `<div class="vazio">Nada com esses filtros. Tente ampliar o período ou trocar o tema.</div>`;
  } else {
    const por = {};
    for (const i of lista) (por[i.canal] ||= []).push(i);
    const canais = Object.entries(por).sort((a,b) => (b[1][0].nota ?? -1) - (a[1][0].nota ?? -1));
    corpo = canais.length ? `<div class="canais">${canais.map(([c, l]) => `<section class="cn">
        <div class="cn-h"><span class="ini">${esc(iniciais(c))}</span><b>${esc(c)}</b><small>${l.length} notícia${l.length > 1 ? "s" : ""}</small></div>
        ${l.slice(0, ui["mais_" + c] ? 20 : 4).map(i => `<div class="li" data-abrir="${esc(i.id)}">
          <div class="tm" ${i.imagem ? `style="background-image:url('${esc(i.imagem)}')"` : ""}></div>
          <div class="tx"><b>${esc(i.titulo)}</b>${i.pitch ? `<em>${esc(i.pitch.gancho)}</em>` : ""}
            <div class="meta" style="margin-top:4px">${i.em_alta ? `<span class="tag" style="background:var(--red)">em alta</span>` : ""}<span>${esc(ha(i.publicado_em))}</span></div></div>
          <span class="nb" style="color:${corNota(i.nota)}">${i.nota ?? "—"}</span></div>`).join("")}
        ${l.length > 4 ? `<button class="mais" data-mais="${esc(c)}">${ui["mais_" + c] ? "Mostrar menos" : `Ver todas as ${l.length}`}</button>` : ""}
      </section>`).join("")}</div>` : `<div class="vazio">Nada com esses filtros.</div>`;
  }

  $("app").innerHTML = `
    ${cal.length ? `<div class="sub" style="margin-bottom:8px;letter-spacing:1.3px;text-transform:uppercase;font-size:11px">Calendário: datas chegando</div>
      <div class="cal">${cal.map(c => `<button class="cdia" data-abrir="${esc(c.id)}"><small>${esc(ha(c.publicado_em))} · nota ${c.nota ?? "—"}</small><b>${esc(c.titulo)}</b><span>${esc(c.pitch?.gancho || "")}</span></button>`).join("")}</div>` : ""}
    <div class="barra">
      <div class="abas"><button class="${ui.vista === "melhores" ? "on" : ""}" data-vista="melhores">Melhores do dia</button><button class="${ui.vista === "canais" ? "on" : ""}" data-vista="canais">Por canal</button></div>
      <div class="fg"><span>Tema</span>${chips("tema", TEMAS)}</div>
      <div class="fg"><span>Público</span>${chips("publico", PUBS)}</div>
      <div class="fg"><span>Período</span>${chips("frescor", FRESC)}</div>
      <div class="fg"><span>Mostrar</span>${chips("status", STATUS)}<button class="chip ${ui.alta ? "on" : ""}" data-alta>Só em alta</button></div>
    </div>${corpo}`;
}

async function mudarStatus(id, status){
  const i = itens.find(x => x.id === id); if (!i) return;
  const antes = i.status; i.status = status; render(); if (!$("modal").classList.contains("hide")) abrir(id);
  if (DEMO) return;
  const {error} = await sb.from("radar").update({status}).eq("id", id);
  if (error){ i.status = antes; render(); alert("Não salvou: " + error.message); }
}
function abrir(id){
  const i = itens.find(x => x.id === id); if (!i) return;
  $("modal").innerHTML = cardNoticia(i, true); $("modal").classList.remove("hide");
}

document.addEventListener("click", ev => {
  const t = ev.target;
  const f = t.closest("[data-f]"); if (f){ ui[f.dataset.f] = isNaN(f.dataset.v) ? f.dataset.v : Number(f.dataset.v); salvarUi(); return render(); }
  const v = t.closest("[data-vista]"); if (v){ ui.vista = v.dataset.vista; salvarUi(); return render(); }
  if (t.closest("[data-alta]")){ ui.alta = !ui.alta; salvarUi(); return render(); }
  const m = t.closest("[data-mais]"); if (m){ ui["mais_" + m.dataset.mais] = !ui["mais_" + m.dataset.mais]; return render(); }
  const s = t.closest("[data-st]"); if (s) return mudarStatus(s.dataset.st, s.dataset.v);
  const p = t.closest("[data-pauta]"); if (p){ mudarStatus(p.dataset.pauta, "virou_pauta"); return; }
  const a = t.closest("[data-abrir]"); if (a) return abrir(a.dataset.abrir);
  if (t === $("modal")) $("modal").classList.add("hide");
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("modal").classList.add("hide"); });

async function carregar(){
  if (DEMO){ itens = demo(); return render(); }
  const {data:sess} = await sb.auth.getSession();
  if (!sess.session){ $("app").innerHTML = `<div class="centro">Entre no painel primeiro.<br><a class="btn red" href="./" style="margin-top:12px;color:#fff">Ir para o login</a></div>`; return; }
  const desde = new Date(Date.now() - 8*864e5).toISOString();
  const {data, error} = await sb.from("radar").select("*").or(`publicado_em.gte.${desde},calendario.is.true`).order("nota", {ascending:false, nullsFirst:false}).limit(600);
  if (error){ $("app").innerHTML = `<div class="centro">Não consegui carregar o radar: ${esc(error.message)}</div>`; return; }
  itens = data; render();
}
carregar();
setInterval(() => { if (document.visibilityState === "visible" && $("modal").classList.contains("hide")) carregar(); }, 5*60000);

function demo(){
  const h = new Date().toISOString(), on = new Date(Date.now()-5*3600e3).toISOString();
  return [
    {id:"a", canal:"The Guardian", titulo:"Weight-loss jabs users lose muscle too, study finds", link:"https://example.com", imagem:null, publicado_em:on, coletado_em:h, tema:"saude", nota:91, publico:"executivo 30–45", em_alta:true, curado:true, status:"novo",
     motivo:"GLP-1 está em alta e o executivo que usa precisa de força para não perder massa.", pitch:{gancho:"Emagrecer rápido está levando o seu músculo junto.", angulo:"Perda de peso sem treino de força é perda de massa magra.", formato:"Carrossel decodificado", ponte:"Avaliação com composição corporal antes e durante o uso."}},
    {id:"b", canal:"Folha Equilíbrio", titulo:"Mulheres na menopausa ganham força com treino de carga", link:"https://example.com", publicado_em:on, coletado_em:h, tema:"saude", nota:84, publico:"mulher 30–50", curado:true, status:"novo",
     motivo:"Fala direto com o medo de masculinizar e com a perda de massa na menopausa.", pitch:{gancho:"Carga não masculiniza. Protege.", angulo:"Força como proteção óssea e metabólica.", formato:"Reels mito x método", ponte:"Plano 2x por semana com carga progressiva."}},
    {id:"c", canal:"Wired", titulo:"The smart ring that tracks your recovery", link:"https://example.com", publicado_em:on, coletado_em:h, tema:"tecnologia", nota:58, publico:"executivo 30–45", curado:true, status:"novo",
     motivo:"Executivo gosta de dados; o anel mede, mas não decide o treino.", pitch:{gancho:"Seu anel mede o sono. Quem decide o treino?", angulo:"Dado sem critério é ruído.", formato:"Reels bastidor", ponte:"Avaliação transforma dado em plano."}},
    {id:"d", canal:"BBC News", titulo:"Elections update", publicado_em:on, coletado_em:h, curado:false, status:"novo"},
    {id:"cal-novembro-azul-2026", canal:"Calendário", titulo:"Novembro Azul", publicado_em:"2026-11-01T09:00:00-03:00", calendario:true, nota:95, pitch:{gancho:"O homem que cuida do carro e não cuida do corpo.", angulo:"Saúde do homem além do exame.", formato:"Série do mês", ponte:"Avaliação com foco no homem 35+."}, tema:"saude", publico:"executivo 30–45"},
  ];
}
</script>
</body>
</html>
